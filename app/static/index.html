<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>M3U8 Detector</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; max-width: 760px; margin: 60px auto; padding: 0 20px; }
    input, button { font: inherit; }
    input { width: 100%; box-sizing: border-box; padding: 14px; margin: 12px 0; }
    button { padding: 12px 18px; cursor: pointer; }
    #result { white-space: pre-wrap; word-break: break-all; margin-top: 24px; padding: 16px; border: 1px solid #ddd; border-radius: 10px; min-height: 24px; }
  </style>
</head>
<body>
  <h1>M3U8 Detector</h1>
  <p>접근 권한이 있는 페이지의 동적 네트워크 요청을 분석합니다.</p>

  <input id="url" placeholder="https://example.com/page" autocomplete="url">
  <button id="go">분석하기</button>

  <div id="result">대기 중</div>

  <script>
    const urlInput = document.getElementById("url");
    const button = document.getElementById("go");
    const result = document.getElementById("result");

    button.addEventListener("click", async () => {
      const url = urlInput.value.trim();
      if (!url) return;

      button.disabled = true;
      result.textContent = "분석 대기열에 추가되었습니다...";

      try {
        const res = await fetch("/api/analyze", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({url})
        });

        const data = await res.json();

        if (data.ok) {
          result.textContent = data.url;
        } else {
          result.textContent = data.message || "찾지 못했습니다.";
        }
      } catch (e) {
        result.textContent = "서버 요청 실패";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
