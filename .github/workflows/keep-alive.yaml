name: Keep Render App Alive #wtf

on:
  schedule:
    # GitHub Actions 스케줄은 정확히 지켜지지 않을 수 있어서
    # Render의 15분 슬립 기준보다 여유 있게 10분 간격으로 설정
    - cron: '*/10 * * * *'
  workflow_dispatch: {}  # 수동 실행도 가능하게

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" https://m3u8-uedh.onrender.com
